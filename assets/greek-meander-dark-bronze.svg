<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050208"/>
      <stop offset="50%" stop-color="#120818"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <!-- copper-bronze fade from reference photo -->
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#321B16"/>
      <stop offset="18%" stop-color="#63351C"/>
      <stop offset="38%" stop-color="#8B5528"/>
      <stop offset="50%" stop-color="#C48940"/>
      <stop offset="62%" stop-color="#8B5528"/>
      <stop offset="82%" stop-color="#63351C"/>
      <stop offset="100%" stop-color="#321B16"/>
    </linearGradient>
  </defs>
  <rect width="24" height="28" fill="url(#bg)"/>
  <g fill="none" stroke="url(#br)" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter">
    <!-- continuous top & bottom rails -->
    <path d="M0 5.2 H24"/>
    <path d="M0 22.8 H24"/>
    <!-- one continuous Greek key — tile edge joins next key with no gap -->
    <path d="M0 5.2 H12 V20.5 H6.2 V13.2 H10.5 V11 H3.8 V22.8 H20.2 V5.2 H24"/>
  </g>
</svg>
