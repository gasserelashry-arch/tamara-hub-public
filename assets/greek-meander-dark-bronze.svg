<svg xmlns="http://www.w3.org/2000/svg" width="40" height="32" viewBox="0 0 40 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0610"/>
      <stop offset="50%" stop-color="#120818"/>
      <stop offset="100%" stop-color="#0a0610"/>
    </linearGradient>
    <!-- vertical metallic shine on the bronze stroke (photo look) -->
    <linearGradient id="br" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1c14"/>
      <stop offset="18%" stop-color="#8a5230"/>
      <stop offset="42%" stop-color="#d4a060"/>
      <stop offset="50%" stop-color="#e8c078"/>
      <stop offset="58%" stop-color="#d4a060"/>
      <stop offset="82%" stop-color="#8a5230"/>
      <stop offset="100%" stop-color="#3a1c14"/>
    </linearGradient>
  </defs>
  <rect width="40" height="32" fill="url(#bg)"/>
  <!--
    Continuous Greek key (meander), seamless tile width=40.
    Path enters at left on the top rail and exits at right on the top rail
    so repeats connect with zero gap — same structure as the reference banner.
  -->
  <g fill="none" stroke="url(#br)" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M0 6 H40"/>
    <path d="M0 26 H40"/>
    <path d="M0 6 H16 V24 H8 V14 H14 V12 H4 V26 H28 V6 H40"/>
  </g>
</svg>
